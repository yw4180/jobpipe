# Target company list
#
# Every ats/token below has been verified live with `python jobpipe.py verify`.
# Job boards change and tokens go stale — re-run verify every week or two and
# delete or fix any entry that fails.
#
# Fields:
#   ats:     greenhouse | lever | ashby | workday
#            | amazon | meta | apple | microsoft (first-party career sites) | eightfold (Netflix etc.)
#   token:   job-board identifier (first-party adapters ignore it; any placeholder works)
#   site:    workday format "{tenant}/{wdN}/{SiteName}"; eightfold format "{host}/{domain}"
#   bar:     high = high-bar shops where cold applications rarely convert (scored -12, excluded from the golden page)
#   sponsor: heavy | yes | unknown | none  <- seed guess; overwritten by real H-1B data once sponsor-ingest has run
#   tier:    1=priority 2=regular 3=backup (for your own reference only, not used in scoring)

