# Candidate profile — the single source of truth for scoring rules.
# Edit this file to change how the shortlist is ranked; no code changes needed.

candidate:
  name: Jane Doe
  current: Data Engineer @ Acme Corp (New York)
  years_experience: 2
  needs_sponsorship: true   # false disables all sponsorship-based rejection/scoring
  visa: "F-1 OPT, needs H-1B sponsorship"
  targets: [Data Engineer, Analytics Engineer, ML Platform Engineer]

# ── Job title matching ───────────────────────────────────
# A hit takes that tier's score (highest tier wins, no stacking). Lowercase substring match.
titles:
  strong: # 45 pts: core targets
    - data engineer
    - analytics engineer
    - data platform engineer
    - data infrastructure engineer
    - data pipeline engineer
    - big data engineer
    - etl engineer
  good: # 32 pts: adjacent directions worth surfacing
    - machine learning engineer
    - ml platform
    - ml infrastructure
    - mlops
    - data infrastructure
    - platform engineer, data
    - software engineer, data
    - backend engineer, data
    - data scientist   # promoted tier: a legitimate target direction (eligible for the golden lane)
    - ai engineer      # promoted tier: counts if you have production LLM experience (e.g. an LLM support bot or RAG system)
    - llm engineer
    - genai engineer
    - generative ai engineer
    - applied ai engineer
  weak: # 15 pts: reachable but not the main focus
    - business intelligence engineer
    - software engineer
    - backend engineer
    - data analyst

# Any of these in the title = immediate reject (wrong seniority / wrong direction).
# Entries match on **word boundaries**, not substrings: 'staff' will not hit 'staffing'.
# A trailing * makes it a prefix match, e.g. 'idempoten*' covers idempotent / idempotency.
title_blockers:
  - staff
  - principal
  - director
  - vp
  - head of
  - manager
  - architect
  - intern
  - phd
  - lead
  - fellow
  - apprentice

# ── Years of experience (matters far more than the title) ──
# Observed in practice: some "Data Engineer" titles ask for 8+ years in the body,
# while some "Senior" titles only ask for 3. So the **JD body requirement is the
# primary signal**; the title is only a fallback when the body states no number.
# Example: a candidate with ~2 years of experience.
yoe:
  bonus: # the **minimum** years the JD asks for -> points (3+ years gets a mild penalty)
    2: 18 # <=2 years: genuinely junior, the best targets
    3: -4 # 3 years: reachable but discounted odds — should only surface when other signals are strong
    4: -10 # 4 years: a stretch
    5: -16 # 5 years: off target
    7: -20 # 6-7 years: near-hopeless, but not rejected (the requirement may be inflated)
  above_max_penalty: -20
  reject_at: 8 # >=8 years: hard reject, don't waste a shortlist slot

# Junior signals in the title, bonus points (highest tier wins, no stacking)
junior_title_bonus:
  junior: 14
  entry level: 14
  entry-level: 14
  new grad: 14
  new graduate: 14
  university grad: 14
  associate: 10
  "i": 8 # "Analytics Engineer I"
  "ii": 4 # "Data Engineer II" is usually still 2-3 years

# Seniority penalties from the title — applied only when the JD body states no
# years requirement (see the explanation in score.py)
title_penalties:
  senior: 18
  sr: 18
  iii: 12   # institutional pay-grade (hospitals/universities), not always senior — soft penalty, let YoE decide (2026-08-18)
  iv: 20

# ── Tech keywords ────────────────────────────────────────
# Each hit scores once, capped at keyword_cap so long JDs can't farm points.
keyword_cap: 30
keywords:
  # Your strongest stack — highest weights
  bigquery: 6
  pub/sub: 6
  pubsub: 6
  gcp: 5
  google cloud: 5
  airflow: 5
  dbt: 4
  kafka: 4
  spark: 4
  snowflake: 3
  databricks: 3
  # Capabilities you have genuinely shipped
  streaming: 4
  real-time: 3
  idempoten*: 5 # idempotent / idempotency
  data quality: 5
  observability: 4
  schema: 3
  partition: 3
  data model: 3
  batch: 2
  etl: 2
  elt: 2
  pipeline: 2
  # Languages / fundamentals
  python: 4
  sql: 4
  linux: 2
  bash: 2
  terraform: 2
  docker: 2
  kubernetes: 2
  # MLE / ML Platform direction
  feature store: 5
  feature engineering: 4
  ranking: 3
  recommendation: 3
  inference: 3
  model serving: 3
  # AI/LLM direction (weight these up if you have production LLM/RAG experience)
  llm: 5
  rag: 5
  retrieval-augmented: 5
  embedding*: 4      # embedding / embeddings
  genai: 4
  generative ai: 4
  claude: 4
  anthropic: 3
  openai: 3
  prompt: 3
  vector: 3          # vector database / vector search
  langchain: 2
  # Domain bonuses (edit to match your own domain background)
  ads: 3
  advertising: 3
  ctr: 3
  healthcare: 2
  biotech: 2

# These signal the role points a different direction; each hit subtracts points
keyword_penalties:
  frontend: 6
  react: 4
  ios: 6
  android: 6
  game: 5
  salesforce: 5
  sap: 6
  php: 5
  ".net": 5
  unreal: 6

# ── Locations ────────────────────────────────────────────
# Example tiers for an NYC-based candidate — edit for your metro (or run `python jobpipe.py init` to generate)
# Tiered bonuses, not tiered rejection: any US location is kept, lower tiers
# just score less. The highest matching tier wins. Tiers with us_anchor=true can
# "rescue" a posting that also lists overseas locations
# ("New York or London" should stay; "Remote - India" should not).
locations:
  tiers:
    - name: nyc # New York metro area
      points: 14
      us_anchor: true
      match: [new york, nyc, manhattan, brooklyn, queens, long island city,
              white plains, yonkers, "ny"]
    - name: remote # remote (can stay put)
      points: 12
      us_anchor: false
      match: [remote, distributed, work from home, anywhere]
    - name: nj # New Jersey towns adjacent to NYC
      points: 11
      us_anchor: true
      match: [jersey city, hoboken, newark, weehawken, secaucus, edison,
              iselin, princeton, morristown, parsippany, basking ridge,
              berkeley heights, warren, new jersey, "nj"]
    - name: ca_sea # California + Seattle (same priority)
      points: 9
      us_anchor: true
      # Note: never add a bare "ca" — it would match "CA-Ontario-Toronto"-style
      # Canadian strings and "rescue" overseas postings (via the us_anchor logic).
      # California postings almost always carry a city name or "california".
      match: [san francisco, "sf", bay area, palo alto, mountain view,
              sunnyvale, san jose, santa clara, menlo park, cupertino,
              redwood city, san mateo, oakland, los angeles, san diego,
              irvine, california,
              seattle, bellevue, redmond, kirkland, washington]
    - name: tx # major Texas cities
      points: 6
      us_anchor: true
      match: [austin, dallas, houston, san antonio, fort worth, plano,
              irving, texas, "tx"]

  # Other US locations (Boston, Chicago, Denver, ...): still included, just fewer points
  default_points: 2

