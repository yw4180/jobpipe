# ── Sponsorship detection ────────────────────────────────
# Regexes run against the JD body. A negative hit = hard reject
# (the posting is useless to a sponsorship-needing candidate).
sponsorship:
  negative:
    - "not\\s+(?:be\\s+)?(?:able|willing)\\s+to\\s+(?:provide|offer|sponsor)"
    - "(?:do(?:es)?\\s+not|will\\s+not|cannot|unable\\s+to)\\s+sponsor"
    - "no\\s+(?:visa\\s+)?sponsorship"
    - "without\\s+(?:the\\s+need\\s+for\\s+)?(?:visa\\s+)?sponsorship"
    - "sponsorship\\s+is\\s+not\\s+(?:available|offered|provided)"
    - "must\\s+be\\s+(?:a\\s+)?u\\.?s\\.?\\s+citizen"
    - "u\\.?s\\.?\\s+citizenship\\s+(?:is\\s+)?required"
    - "security\\s+clearance"
    - "(?:active|ability to obtain).{0,20}clearance"
    - "green\\s+card\\s+holders?\\s+only"
    - "citizens?\\s+or\\s+permanent\\s+residents?\\s+only"
    # Hedged/indirect phrasings (2026-08-18; real Roblox example: "may not be
    # able to employ ... or support future H-1B sponsorship at this time")
    - "not\\s+(?:be\\s+)?able\\s+to[\\s\\S]{0,160}sponsor"
    - "not[\\s\\S]{0,80}support\\s+(?:future\\s+)?h-?1b"
  positive: # +10
    - "(?:will|can|do)\\s+sponsor"
    - "visa\\s+sponsorship\\s+(?:is\\s+)?available"
    - "sponsorship\\s+(?:is\\s+)?(?:available|offered|provided)"
    - "h-?1b\\s+transfer"
    - "we\\s+sponsor"

# ── Company-level sponsorship track record bonus (from USCIS H-1B data) ──
# Thresholds calibrated against the real FY2022+FY2023 distribution, see jpipe/sponsor.py
sponsor_history_bonus:
  heavy: 15 # >=25 H-1B records: reliably sponsors
  yes: 10 # 3-24 records: routine sponsor
  low: 4 # 1-2 records: has sponsored, but not the norm
  unknown: 0 # H-1B data not imported yet
  none: -5 # no records found. Only a small penalty — legal entity names very often
  #        don't match brand names, and a false "doesn't sponsor" costs more than
  #        a miss, so judge leniently

# ── Project story routing ────────────────────────────────
# The shortlist uses JD keyword hits to suggest which story to lead with for each company.
# Story names must match the keys in the stories section of answers.yaml —
# the board joins them by name.
stories:
  - name: "Streaming pipeline"
    pitch: "Migrated a 24h batch process to event-driven near-real-time (Pub/Sub + partitioned BigQuery + idempotent ingestion)"
    triggers: [pub/sub, pubsub, streaming, real-time, kafka, event-driven, bigquery, gcp, idempoten, schema, airflow, etl, elt]
  - name: "Feature pipelines"
    pitch: "Daily feature-generation pipelines feeding a recommendation system at large scale"
    triggers: [feature store, feature engineering, ranking, recommendation, ads, advertising, ctr, experimentation, a/b]

# ── Company bar (is it within reach?) ────────────────────
# Companies marked bar: high in companies.yaml (top quant shops / frontier AI labs /
# top-bar infra): cold applications from a junior candidate needing sponsorship
# convert at near zero there. Not rejected (referrals are a different story),
# but scored down to make room for reachable roles. bar: low is reserved for
# companies with visibly less competition.
bar_adjust:
  high: -12
  low: 6

# ── Golden postings (entry criteria for the board's "golden" page) ──────
# Definition: fresh (truly posted <=48h, the free early-application leverage still
# applies) x score high enough x required years within reach x sponsor track record
# x not a high-bar shop. This small set is what deserves daily attention.
golden:
  max_age_days: 2
  second_window_days: 4   # catch-up lane: 48-96h (covers weekends / a two-day gap)
  min_score: 60
  max_req_yoe: 2     # golden rule: only <=2 years required (no stated requirement also passes)
  # Compromise: 3-year roles don't make the TOP lane by default, but an exceptional
  # score overrides — a 100-point pure-DE role shouldn't be filtered away;
  # the catch-up lane is uniformly relaxed to <=3
  stretch_yoe: 3
  stretch_min_score: 80   # score floor for a 3-year role to break into the TOP lane
  exclude_senior_title: true   # senior/sr titles never go golden — honestly low odds, don't take a slot
  sponsor: [heavy, yes, positive, low]   # low passes too: low counts from entity-name mismatches are common
  exclude_bar: [high]
  title_tiers: [strong, good]
  tier_stretch_min_score: 75
  backlog_min_score: 85   # backlog section: high-score jobs that aged past the fresh window
  backlog_max_age: 30   # weak-tier titles admitted if score >= this   # core directions only; generic SWE riding a freshness bonus is not golden

# ── LLM fine-screening (jpipe/enrich.py, second pass after fetch) ──────
# The long tail regexes can't handle ("8+ years across...") goes through a
# lightweight model. Needs ANTHROPIC_API_KEY; if unset it is skipped
# automatically and the rest of the pipeline is unaffected.
llm:
  enabled: true
  backend: auto             # auto = use the API when a key is set, otherwise cc (Claude Code subscription quota, zero marginal cost)
  model: claude-haiku-4-5   # used by the api backend; the cc backend is pinned to --model haiku
  max_per_run: 200          # per-run call ceiling (cost/quota guardrail)

# ── Freshness ────────────────────────────────────────────
# Applying early gets you seen first — the only free leverage in cold applications.
# But posted_at is the true publish date; ats_updated only means the recruiter
# edited the posting once, so it must carry much less weight
# (see the comments in sources/greenhouse.py).
freshness:
  posted_bonus: # by true publish date, days -> points
    1: 22 # within 24h
    3: 14
    7: 7
    14: 3
  updated_bonus: # granted only when posted_at is already old but the posting was recently edited
    3: 5
    7: 2
  fresh_window_days: 1 # definition of "fresh": posted within 24h
  fresh_reserved: 5 # minimum slots per shortlist reserved for sub-24h postings
  fresh_lane_min_score: 55 # the reserved lane still has a floor — don't apply to generic SWE just because it's new

# ── Thresholds ───────────────────────────────────────────
thresholds:
  archive_days: 30 # auto-archive postings older than this (almost certainly no longer collecting resumes); keeps the DB rolling
  shortlist_min_score: 45 # below this score a posting never makes the daily shortlist
  daily_shortlist_size: 8 # how many to generate per day — a few more than you plan to send leaves room to skip
  stale_days: 45 # a posting untouched for this long is considered expired
  ghost_days: 21 # an application silent for this long counts as ghosted
  concurrent_per_company: 3 # max simultaneous processes per company; beyond this its postings stop surfacing
